name: Build and Validate PDF Pro APK

on:
  push:
    branches: [feat/pdf-pro-tools]
    paths:
      - 'App.tsx'
      - 'ProApp.tsx'
      - 'DashboardApp.tsx'
      - 'app.json'
      - 'index.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'services/**'
      - 'components/**'
      - 'modules/**'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pdf-pro-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: true
      APK_NAME: PDF-Pro-Tools-1.4.1.apk
      BASELINE_APK_NAME: PDF-Pro-Tools-1.3.0-baseline.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare validation output
        run: mkdir -p release-output

      - name: Install dependencies and refresh lockfile
        run: |
          npm install --no-audit --no-fund
          cp package-lock.json release-output/package-lock.generated.json

      - name: TypeScript validation
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK package, signature and archive
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "release-output/$APK_NAME"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "release-output/$APK_NAME" | tee release-output/signature-verification.txt
          sha256sum "release-output/$APK_NAME" | tee release-output/PDF-Pro-Tools-1.4.1.sha256
          unzip -t "release-output/$APK_NAME" > release-output/zip-integrity.txt
          "$BUILD_TOOLS/aapt" dump badging "release-output/$APK_NAME" > release-output/apk-badging-full.txt

          grep -q "package: name='com.codecsverige.pdf'" release-output/apk-badging-full.txt
          grep -q "versionCode='6'" release-output/apk-badging-full.txt
          grep -q "versionName='1.4.1'" release-output/apk-badging-full.txt

          python3 - <<'PY'
          import zipfile
          path = 'release-output/PDF-Pro-Tools-1.4.1.apk'
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
              abis = sorted({name.split('/')[1] for name in names if name.startswith('lib/') and name.count('/') >= 2})
              assert 'AndroidManifest.xml' in names
              assert 'classes.dex' in names
              assert 'arm64-v8a' in abis, f'arm64-v8a missing: {abis}'
              print('ABIS=' + ','.join(abis))
          PY

          cat > release-output/build-identity.txt <<'EOF'
          app=PDF Pro
          version=1.4.1
          versionCode=6
          androidPackage=com.codecsverige.pdf
          build=standalone-release
          validation=signature+archive+badging+baseline-upgrade+emulator-launch
          EOF

      - name: Download last known good 1.3.0 APK and verify signer continuity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9148637541/zip" \
            -o /tmp/pdf-pro-baseline.zip
          rm -rf /tmp/pdf-pro-baseline
          mkdir -p /tmp/pdf-pro-baseline
          unzip -q /tmp/pdf-pro-baseline.zip -d /tmp/pdf-pro-baseline
          cp /tmp/pdf-pro-baseline/PDF-Pro-Tools-1.3.0.apk "release-output/$BASELINE_APK_NAME"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "release-output/$BASELINE_APK_NAME" | tee release-output/baseline-signature-verification.txt
          "$BUILD_TOOLS/aapt" dump badging "release-output/$BASELINE_APK_NAME" > release-output/baseline-apk-badging-full.txt

          grep -q "package: name='com.codecsverige.pdf'" release-output/baseline-apk-badging-full.txt
          grep -q "versionCode='4'" release-output/baseline-apk-badging-full.txt
          grep -q "versionName='1.3.0'" release-output/baseline-apk-badging-full.txt

          NEW_CERT="$(grep -m1 'certificate SHA-256 digest:' release-output/signature-verification.txt | sed 's/.*digest: //')"
          OLD_CERT="$(grep -m1 'certificate SHA-256 digest:' release-output/baseline-signature-verification.txt | sed 's/.*digest: //')"
          echo "NEW_CERT=$NEW_CERT" | tee release-output/signer-continuity.txt
          echo "OLD_CERT=$OLD_CERT" | tee -a release-output/signer-continuity.txt
          test -n "$NEW_CERT"
          test "$NEW_CERT" = "$OLD_CERT"
          echo 'SIGNER_CONTINUITY=PASS' | tee -a release-output/signer-continuity.txt

      - name: Free disk space before emulator
        shell: bash
        run: |
          df -h
          rm -rf android node_modules "$HOME/.gradle/caches" "$HOME/.npm/_cacache" || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Upgrade from 1.3.0 and launch 1.4.1 on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disk-size: 2048M
          ram-size: 1536M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/smoke-emulator.sh

      - name: Upload validated APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Pro-Tools-1.4.1-validated
          path: release-output/
          if-no-files-found: warn
          retention-days: 30
