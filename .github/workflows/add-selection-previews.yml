name: Add selected file previews

on:
  push:
    branches: [feat/pdf-pro-tools]
    paths:
      - '.github/workflows/add-selection-previews.yml'
      - 'scripts/apply-selection-previews.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pdf-pro-tools
          fetch-depth: 0

      - name: Apply selected-file preview upgrade
        run: python3 scripts/apply-selection-previews.py

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Commit previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DashboardApp.tsx app.json .github/workflows/android-build.yml scripts/smoke-emulator.sh
          git commit -m 'feat(ui): add professional selected-file previews'
          git push origin HEAD:feat/pdf-pro-tools
