name: Add selected file previews

on:
  push:
    branches: [feat/pdf-pro-tools]
    paths:
      - '.github/workflows/add-selection-previews.yml'
      - 'scripts/apply-selection-previews.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pdf-pro-tools
          fetch-depth: 0

      - name: Apply selected-file preview upgrade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code = Path('scripts/apply-selection-previews.py').read_text()
          workflow_block = """build_path = Path('.github/workflows/android-build.yml')\nbuild = build_path.read_text().replace('1.4.1', '1.4.2')\nbuild = build.replace(\"versionCode='6'\", \"versionCode='7'\").replace('versionCode=6', 'versionCode=7')\nbuild_path.write_text(build)\n\n"""
          if workflow_block not in code:
              raise SystemExit('workflow mutation block not found')
          code = code.replace(workflow_block, '')
          exec(compile(code, 'apply-selection-previews.py', 'exec'))
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Commit previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DashboardApp.tsx app.json scripts/smoke-emulator.sh
          git commit -m 'feat(ui): add professional selected-file previews'
          git push origin HEAD:feat/pdf-pro-tools
