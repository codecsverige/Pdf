name: Build Google Play Production AAB

on:
  push:
    branches: [feat/pdf-pro-tools]
    paths:
      - 'DashboardApp.tsx'
      - 'app.json'
      - 'index.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'services/**'
      - 'components/**'
      - 'modules/**'
      - 'assets/**'
      - '.github/workflows/production-aab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-pro-production-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      BUNDLETOOL_VERSION: 1.18.3
      EXPECTED_PACKAGE: com.codecsverige.pdf
      EXPECTED_TARGET_SDK: '36'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Read immutable app identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE=$(node -p "require('./app.json').expo.android.package")
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          VERSION_NAME=$(node -p "require('./app.json').expo.version")
          test "$PACKAGE" = "$EXPECTED_PACKAGE"
          test "$VERSION_CODE" -ge 10
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate clean Android project
        run: npx expo prebuild --platform android --clean

      - name: Remove Expo debug signing from release build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          original = s
          s = s.replace('signingConfig signingConfigs.debug', '')
          if s == original:
              raise SystemExit('Expected Expo debug signingConfig was not found')
          p.write_text(s)
          PY

      - name: Build unsigned release AAB
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Collect AAB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-output
          AAB=$(find android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)
          test -s "$AAB"
          OUT="production-output/PDF-Pro-${{ steps.identity.outputs.version_name }}-vc${{ steps.identity.outputs.version_code }}-production-unsigned.aab"
          cp "$AAB" "$OUT"
          sha256sum "$OUT" | tee production-output/SHA256SUMS.txt
          unzip -t "$OUT" > production-output/aab-zip-integrity.txt
          jarsigner -verify "$OUT" >/tmp/jarsigner.txt 2>&1 || true
          cat /tmp/jarsigner.txt | tee production-output/unsigned-signing-state.txt
          grep -qi 'jar is unsigned' /tmp/jarsigner.txt

      - name: Download official bundletool
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            -o /tmp/bundletool.jar
          java -jar /tmp/bundletool.jar version | tee production-output/bundletool-version.txt

      - name: Validate Google Play bundle identity
        shell: bash
        run: |
          set -euo pipefail
          AAB=$(find production-output -maxdepth 1 -name '*.aab' | head -n 1)
          java -jar /tmp/bundletool.jar validate --bundle="$AAB" | tee production-output/bundletool-validate.txt
          java -jar /tmp/bundletool.jar dump manifest --bundle="$AAB" --module=base > production-output/base-manifest.xml
          java -jar /tmp/bundletool.jar dump config --bundle="$AAB" > production-output/bundle-config.txt

          grep -q 'package="${{ steps.identity.outputs.package }}"' production-output/base-manifest.xml
          grep -Eq 'versionCode="${{ steps.identity.outputs.version_code }}"|android:versionCode="${{ steps.identity.outputs.version_code }}"' production-output/base-manifest.xml
          grep -Eq 'targetSdkVersion="36"|android:targetSdkVersion="36"' production-output/base-manifest.xml
          grep -q 'PAGE_ALIGNMENT_16K' production-output/bundle-config.txt

          for forbidden in READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_MEDIA_AUDIO SYSTEM_ALERT_WINDOW; do
            if grep -q "$forbidden" production-output/base-manifest.xml; then
              echo "Forbidden production permission found: $forbidden" >&2
              exit 1
            fi
          done

      - name: Write release evidence
        run: |
          cat > production-output/PRODUCTION-READINESS.txt <<EOF
          PDF Pro ${{ steps.identity.outputs.version_name }}
          versionCode: ${{ steps.identity.outputs.version_code }}
          Package: ${{ steps.identity.outputs.package }}
          Target SDK: 36
          AAB: bundletool validated
          16 KB page alignment requested: PASS
          Broad media/storage permissions: absent
          Signing state: intentionally unsigned in CI; final signing must use the permanent PDF Pro Google Play upload key
          Permanent upload certificate SHA1: 3F:02:EF:1A:D8:6B:43:40:F6:FD:BF:72:B5:B2:7E:32:30:2C:0A:9D
          EOF

      - name: Upload validated unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Pro-production-unsigned-ready
          path: production-output/
          if-no-files-found: error
          retention-days: 30
