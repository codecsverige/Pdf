name: Fix dashboard layout

on:
  push:
    branches: [feat/pdf-pro-tools]
    paths:
      - '.github/workflows/fix-dashboard-layout.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pdf-pro-tools
          fetch-depth: 0
      - name: Apply UI and safe-area fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('DashboardApp.tsx')
          s = p.read_text()

          s = s.replace('  SafeAreaView,\n', '')
          marker = "} from 'react-native';\n"
          if "react-native-safe-area-context" not in s:
              s = s.replace(marker, marker + "import { SafeAreaView, useSafeAreaInsets } from 'react-native-safe-area-context';\n")

          s = s.replace("export default function DashboardApp() {\n", "export default function DashboardApp() {\n  const insets = useSafeAreaInsets();\n", 1)

          s = s.replace('<Header />', "<Header onSettings={() => { setSearch(''); setScreen('settings'); }} />")
          s = s.replace('<SearchBar value={search} onChange={setSearch} />', "<SearchBar value={search} onChange={setSearch} onAllTools={() => { setSearch(''); setScreen('tools'); }} />")
          s = s.replace('contentContainerStyle={styles.homePage}', "contentContainerStyle={[styles.homePage, { paddingBottom: 104 + insets.bottom }]}")

          old_header = '''function Header() {\n  return (\n    <View style={styles.header}>\n      <View style={styles.logoStack}>\n        <View style={styles.logoBack} />\n        <View style={styles.logoFront}><Text style={styles.logoText}>PDF</Text></View>\n      </View>\n      <View style={{ flex: 1 }}><Text style={styles.brand}><Text style={{ color: BRAND }}>PDF</Text> Pro</Text><Text style={styles.brandSub}>Fast · Private · Professional</Text></View>\n      <View style={styles.proAvatar}><Icon name="crown-outline" size={19} color="#FFFFFF" /></View>\n    </View>\n  );\n}\n\nfunction SearchBar({ value, onChange }: { value: string; onChange: (value: string) => void }) {\n  return <View style={styles.searchBar}><Icon name="magnify" size={26} color="#7D8798" /><TextInput value={value} onChangeText={onChange} style={styles.searchInput} placeholder="Search PDF tools" placeholderTextColor="#A3AABA" /><View style={styles.filterButton}><Icon name="tune-variant" size={20} color="#7D8798" /></View></View>;\n}\n'''
          new_header = '''function Header({ onSettings }: { onSettings: () => void }) {\n  return (\n    <View style={styles.header}>\n      <View style={styles.logoStack}>\n        <View style={styles.logoBack} />\n        <View style={styles.logoFront}><Text style={styles.logoText}>PDF</Text></View>\n      </View>\n      <View style={{ flex: 1 }}><Text style={styles.brand}><Text style={{ color: BRAND }}>PDF</Text> Pro</Text><Text style={styles.brandSub}>Fast · Private · Professional</Text></View>\n      <Pressable accessibilityRole="button" accessibilityLabel="Open settings" style={styles.proAvatar} onPress={onSettings}><Icon name="cog-outline" size={20} color="#FFFFFF" /></Pressable>\n    </View>\n  );\n}\n\nfunction SearchBar({ value, onChange, onAllTools }: { value: string; onChange: (value: string) => void; onAllTools: () => void }) {\n  return <View style={styles.searchBar}><Icon name="magnify" size={26} color="#7D8798" /><TextInput value={value} onChangeText={onChange} style={styles.searchInput} placeholder="Search PDF tools" placeholderTextColor="#A3AABA" /><Pressable accessibilityRole="button" accessibilityLabel="Open all PDF tools" style={styles.filterButton} onPress={onAllTools}><Icon name="view-grid-outline" size={20} color="#7D8798" /></Pressable></View>;\n}\n'''
          if old_header not in s:
              raise SystemExit('Header/SearchBar block not found')
          s = s.replace(old_header, new_header)

          old_bottom = '''function BottomNav({ screen, onChange, onQuick }: { screen: ScreenId; onChange: (value: ScreenId) => void; onQuick: () => void }) {\n  const item = (id: ScreenId, icon: string, label: string) => <Pressable style={styles.navItem} onPress={() => onChange(id)}><Icon name={icon} size={24} color={screen === id ? BRAND : '#667085'} /><Text style={[styles.navLabel, screen === id && styles.navLabelActive]}>{label}</Text></Pressable>;\n  return <View style={styles.bottomNav}>{item('home', 'home-variant-outline', 'Home')}{item('files', 'folder-outline', 'Files')}<Pressable style={styles.fab} onPress={onQuick}><Icon name="plus" size={32} color="#FFFFFF" /></Pressable>{item('tools', 'view-grid-outline', 'Tools')}{item('settings', 'cog-outline', 'Settings')}</View>;\n}\n'''
          new_bottom = '''function BottomNav({ screen, onChange, onQuick }: { screen: ScreenId; onChange: (value: ScreenId) => void; onQuick: () => void }) {\n  const insets = useSafeAreaInsets();\n  const item = (id: ScreenId, icon: string, label: string) => <Pressable accessibilityRole="button" accessibilityLabel={label} style={styles.navItem} onPress={() => onChange(id)}><Icon name={icon} size={24} color={screen === id ? BRAND : '#667085'} /><Text style={[styles.navLabel, screen === id && styles.navLabelActive]}>{label}</Text></Pressable>;\n  return <View style={[styles.bottomNav, { bottom: Math.max(10, insets.bottom + 8) }]}>{item('home', 'home-variant-outline', 'Home')}{item('files', 'folder-outline', 'Files')}<Pressable accessibilityRole="button" accessibilityLabel="Quick actions" style={styles.fab} onPress={onQuick}><Icon name="plus" size={32} color="#FFFFFF" /></Pressable>{item('tools', 'view-grid-outline', 'Tools')}{item('settings', 'cog-outline', 'Settings')}</View>;\n}\n'''
          if old_bottom not in s:
              raise SystemExit('BottomNav block not found')
          s = s.replace(old_bottom, new_bottom)

          replacements = {
              "  hero: { height: 224,": "  hero: { minHeight: 204,",
              "  heroCopy: { width: '64%', zIndex: 2 },": "  heroCopy: { width: '62%', zIndex: 2 },",
              "  heroTitle: { color: '#FFFFFF', fontSize: 25, lineHeight: 31,": "  heroTitle: { color: '#FFFFFF', fontSize: 22.5, lineHeight: 28,",
              "  heroText: { color: '#F3F4FF', fontSize: 11.8, lineHeight: 17, fontWeight: '600', marginTop: 9 },": "  heroText: { color: '#F3F4FF', fontSize: 11.2, lineHeight: 16, fontWeight: '600', marginTop: 8 },",
              "  heroButton: { alignSelf: 'flex-start', marginTop: 17,": "  heroButton: { alignSelf: 'flex-start', marginTop: 13,",
              "  toolGrid: { flexDirection: 'row', flexWrap: 'wrap', gap: 9 },": "  toolGrid: { flexDirection: 'row', flexWrap: 'wrap', justifyContent: 'space-between', rowGap: 10 },",
              "  toolTile: { width: '48.7%',": "  toolTile: { width: '48%',",
              "  sheetGrid: { flexDirection: 'row', flexWrap: 'wrap', gap: 10 },": "  sheetGrid: { flexDirection: 'row', flexWrap: 'wrap', justifyContent: 'space-between', rowGap: 10 },",
              "  sheetOption: { width: '48.5%',": "  sheetOption: { width: '48%',",
              "  proAvatar: { width: 40, height: 40, borderRadius: 20, backgroundColor: '#7C3AED',": "  proAvatar: { width: 40, height: 40, borderRadius: 13, backgroundColor: '#111827',",
          }
          for a, b in replacements.items():
              if a not in s:
                  raise SystemExit(f'style fragment not found: {a[:50]}')
              s = s.replace(a, b)

          p.write_text(s)

          index = Path('index.ts')
          index.write_text("""import { registerRootComponent } from 'expo';\nimport React from 'react';\nimport { SafeAreaProvider, initialWindowMetrics } from 'react-native-safe-area-context';\n\nimport App from './DashboardApp';\n\nfunction Root() {\n  return React.createElement(\n    SafeAreaProvider,\n    { initialMetrics: initialWindowMetrics },\n    React.createElement(App),\n  );\n}\n\nregisterRootComponent(Root);\n""")

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          pkg['dependencies']['react-native-safe-area-context'] = '~5.6.0'
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')

          app_path = Path('app.json')
          app = json.loads(app_path.read_text())
          app['expo']['version'] = '1.4.1'
          app['expo']['primaryColor'] = '#F04452'
          app['expo']['android']['versionCode'] = 6
          app['expo']['android']['adaptiveIcon']['backgroundColor'] = '#F04452'
          app_path.write_text(json.dumps(app, indent=2) + '\n')
          PY

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DashboardApp.tsx index.ts package.json package-lock.json app.json
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'fix(ui): repair dashboard grid safe area and actions'
            git push origin HEAD:feat/pdf-pro-tools
          fi
